[package]
name = "geojson"
description = "Read and write GeoJSON vector geographic data"
version = "1.0.0"
authors = ["The GeoRust Developers <mods@georust.org>"]
license = "MIT/Apache-2.0"
repository = "https://github.com/georust/geojson"
readme = "README.md"
documentation = "https://docs.rs/geojson/"
keywords = ["geojson", "gis", "json", "geo"]
edition = "2024"

[features]
default = ["std", "geo-types"]
std = ["serde/std", "serde_json/std", "thiserror/std", "log/std", "geo-types?/std"]

[dependencies]
serde = { version = "~1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "~1.0", default-features = false, features = ["alloc"] }
geo-types = { version = "0.7.13", default-features = false, features = ["serde"], optional = true }
thiserror = { version = "2.0.6", default-features = false }
log = { version = "0.4.17", default-features = false }
tinyvec = { version = "1.10.0", features = ["serde", "alloc"] }

[dev-dependencies]
num-traits = "0.2"
criterion = "0.5.1"

[[bench]]
name = "parse"
required-features = ["std"]
harness = false

[[bench]]
name = "serialize"
required-features = ["std"]
harness = false

[[bench]]
name = "to_geo_types"
required-features = ["std", "geo-types"]
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[[example]]
name = "deserialize"
required-features = ["std"]

[[example]]
name = "deserialize_to_geojson_types"
required-features = ["std"]

[[example]]
name = "deserialize_to_geo_types"
required-features = ["std", "geo-types"]

[[example]]
name = "geojson_to_string"
required-features = ["std"]

[[example]]
name = "stream_reader_writer"
required-features = ["std"]
